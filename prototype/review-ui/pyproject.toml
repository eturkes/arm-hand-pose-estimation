[project]
name = "review-ui"
version = "0.1.0"
description = "Local review UI over the 3-cam corpus: census, clip player with pose overlay, cohort explorer."
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.32,<1",
  "pyyaml>=6.0,<7",
]

[dependency-groups]
# Asset builders only. Both write into static/ and neither runs at serve time.
dev = [
  "fonttools[woff]>=4.55,<5",
  "av>=13,<16",
  "numpy>=2.5.3",
]

[tool.uv]
# No build backend: the server runs as `python -m review_ui` with the project
# directory on sys.path, so nothing installs the prototype itself.
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
